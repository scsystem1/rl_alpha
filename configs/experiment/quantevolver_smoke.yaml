defaults:
  - quantevolver_fair_250.yaml

experiment:
  cells:
    - [quantevolver, qe_native]
  seeds: [0]
  search_steps: 2
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 1
  cpu_threads_per_job: 8
  max_total_cpu_threads: 90
  grpo_ray_cpus: 8
  grpo_reward_candidate_workers: 1
  grpo_object_store_gib: 8
  gpu_devices:
    quantevolver: [4]
  gpu_min_free_mib: {4: 20000}
  gpu_memory_utilization: {4: 0.12}
  auto_start_expensive_jobs: true
