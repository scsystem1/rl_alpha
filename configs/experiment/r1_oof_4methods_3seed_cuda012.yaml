paths:
  code_root: /home/sunyuxiang/rl_alpha/ours
  raw_data_root: /data/sunyuxiang/rl_alpha
  processed_root: /data/sunyuxiang/rl_alpha/processed
  cache_root: /data/sunyuxiang/rl_alpha/cache
  runs_root: /data/sunyuxiang/rl_alpha/runs
  model_search_root: /data/shared/huggingface
  alphagen_root: /home/sunyuxiang/rl_alpha/alphagen
  quantevolver_root: /home/sunyuxiang/rl_alpha/QuantEvolver

experiment:
  cells:
    - [random, r1_oof]
    - [gp, r1_oof]
    - [base_llm, r1_oof]
    - [grpo_llm, r1_oof]
  seeds: [0, 1, 2]
  search_steps: 250
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 6
  cpu_threads_per_job: 8
  max_total_cpu_threads: 96
  grpo_ray_cpus: 8
  grpo_reward_candidate_workers: 1
  grpo_object_store_gib: 8
  # The dedicated launcher assigns the six LLM cells as follows:
  #   CUDA 0: GRPO seed 0
  #   CUDA 1: GRPO seed 2 and Base-LLM seed 0
  #   CUDA 2: Base-LLM seeds 1 and 2
  #   CUDA 3: GRPO seed 1 (CUDA 0 cannot hold two GRPO vLLM instances)
  # Random/GP (six cells total) run on CPU.
  gpu_devices:
    base_llm: [1, 2]
    grpo_llm: [0, 1, 3]
  gpu_min_free_mib: {0: 16000, 1: 16000, 2: 16000}
  # The launcher applies per-process values for the colocated topology:
  # GRPO=0.12 on CUDA 0/1 and Base-LLM=0.16 on CUDA 1/2. The matrix-runner
  # fallback values below are conservative enough
  # to initialize the model while leaving room for the colocated peer.
  gpu_memory_utilization: {0: 0.12, 1: 0.16, 2: 0.16, 3: 0.12}
  auto_start_expensive_jobs: true
