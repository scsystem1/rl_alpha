defaults:
  - ../data/sp500.yaml
  - ../eval/preliminary.yaml

paths:
  code_root: /home/sunyuxiang/rl_alpha/ours
  raw_data_root: /data/sunyuxiang/rl_alpha
  processed_root: /data/sunyuxiang/rl_alpha/processed
  cache_root: /data/sunyuxiang/rl_alpha/cache
  runs_root: /data/sunyuxiang/rl_alpha/runs
  model_search_root: /data/shared/huggingface
  alphagen_root: /home/sunyuxiang/rl_alpha/baseline/alphagen
  quantevolver_root: /home/sunyuxiang/rl_alpha/baseline/QuantEvolver

rolling:
  test_years: [2021, 2022, 2023, 2024, 2025]
  window_scheme: two_calendar_years_then_test_year

evaluation:
  ridge_fit_period: train

experiment:
  cells:
    - [random, r1_oof]
    - [gp, r1_oof]
    - [base_llm, r1_oof]
    - [grpo_llm, r2_paired_oof]
    - [alphasage, r0]
    - [quantevolver, qe_native]
  seeds: [0, 1, 2]
  search_steps: 200
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 6
  cpu_threads_per_job: 8
  max_total_cpu_threads: 96
  grpo_ray_cpus: 8
  grpo_reward_candidate_workers: 1
  grpo_object_store_gib: 8
  gpu_devices:
    base_llm: [1]
    grpo_llm: [2, 3]
    alphasage: [0, 4]
    quantevolver: [0, 4, 1, 3]
  gpu_min_free_mib: {0: 8000, 1: 8000, 2: 18000, 3: 18000, 4: 8000}
  gpu_memory_utilization: {0: 0.12, 1: 0.18, 2: 0.12, 3: 0.12, 4: 0.12}
  auto_start_expensive_jobs: true
