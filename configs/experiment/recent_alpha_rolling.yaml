defaults:
  - ../data/sp500.yaml
  - ../eval/preliminary.yaml
rolling:
  test_years: [2021, 2022, 2023, 2024, 2025]
experiment:
  methods: [random, gp, base_llm, grpo_llm]
  rewards: [r1_oof]
  seeds: [0, 1, 2]
  search_steps: 100
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 2
  cpu_threads_per_job: 8
  max_total_cpu_threads: 90
  grpo_ray_cpus: 8
  grpo_reward_candidate_workers: 1
  grpo_object_store_gib: 8
  gpu_devices:
    base_llm: [1, 2, 4]
    grpo_llm: [3]
  gpu_min_free_mib: {1: 12000, 2: 13000, 3: 26000, 4: 11000}
  gpu_memory_utilization: {1: 0.20, 2: 0.12, 3: 0.15, 4: 0.20}
  auto_start_expensive_jobs: false
