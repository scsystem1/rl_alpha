paths:
  code_root: /home/sunyuxiang/rl_alpha/ours
  raw_data_root: /data/sunyuxiang/rl_alpha
  processed_root: /data/sunyuxiang/rl_alpha/processed
  cache_root: /data/sunyuxiang/rl_alpha/cache
  runs_root: /data/sunyuxiang/rl_alpha/runs
  model_search_root: /data/shared/huggingface
  alphagen_root: /home/sunyuxiang/rl_alpha/alphagen
  quantevolver_root: /home/sunyuxiang/rl_alpha/QuantEvolver

rolling:
  test_years: [2021, 2022, 2023, 2024, 2025]

experiment:
  methods: [random, gp, base_llm, grpo_llm]
  rewards: [r1_oof]
  seeds: [0, 1, 2]
  search_steps: 100
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 6
  cpu_threads_per_job: 8
  max_total_cpu_threads: 96
  grpo_ray_cpus: 8
  grpo_reward_candidate_workers: 1
  grpo_object_store_gib: 8
  # Actual simultaneous placement for each rolling window:
  # cuda:0=GRPO seed 0; cuda:1=GRPO seed 2 + Base-LLM seed 0;
  # cuda:2=Base-LLM seeds 1,2; cuda:3=GRPO seed 1; CPU=Random/GP.
  gpu_devices:
    base_llm: [1, 2]
    grpo_llm: [0, 1, 3]
  gpu_min_free_mib: {0: 16000, 1: 16000, 2: 16000, 3: 22000}
  gpu_memory_utilization: {0: 0.12, 1: 0.16, 2: 0.16, 3: 0.12}
  auto_start_expensive_jobs: true
