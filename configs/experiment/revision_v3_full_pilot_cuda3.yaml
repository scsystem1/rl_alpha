  raw_data_root: /data/sunyuxiang/rl_alpha
  processed_root: /home/sunyuxiang/rl_alpha/ours/artifacts/processed_v3
  cache_root: /home/sunyuxiang/rl_alpha/ours/artifacts/cache_v3
  runs_root: /home/sunyuxiang/rl_alpha/ours/artifacts/runs_v3
  model_search_root: /data/shared/huggingface
  alphagen_root: /home/sunyuxiang/rl_alpha/alphagen
  quantevolver_root: /home/sunyuxiang/rl_alpha/QuantEvolver
experiment:
  methods: [random, gp, base_llm, grpo_llm]
  rewards: [r0, r1, r2_lcb]
  seeds: [0]
  valid_unique_budget: 64
  proposal_group_size: 8
  pool_capacity: 20
  max_cpu_jobs: 2
  cpu_threads_per_job: 8
  gpu_devices:
    base_llm: [3]
    grpo_llm: [3]
  # The verified two-epoch GRPO path needs roughly 34 GiB in addition to
  # unrelated resident processes. Wait for a safe margin instead of killing
  # or oversubscribing another user's workload.
  gpu_min_free_mib: {3: 50000}
  gpu_memory_utilization: {3: 0.15}
  auto_start_expensive_jobs: true
