[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlalpha"
version = "0.1.0"
description = "Leakage-safe risk-neutral alpha mining research scaffold"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "pydantic>=2",
  "PyYAML>=6",
  "typer>=0.12",
  "rich>=13",
  "statsmodels>=0.14",
  "filelock>=3.13",
  "zarr>=3",
  "bottleneck==1.6.0",
  "numba>=0.61",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6"]
portfolio = ["cvxpy>=1.5", "osqp>=0.6"]
llm = ["torch", "transformers", "accelerate", "peft", "ray", "vllm", "verl", "xgrammar"]

[project.scripts]
rlalpha = "rlalpha.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not gpu and not slow and not real_data'"
markers = [
  "gpu: requires a working CUDA GPU",
  "slow: long-running test",
  "real_data: requires the S&P 500 parquet bundle",
]
